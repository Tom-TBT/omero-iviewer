<template>
    <div class="regions-tags">
        <div class="disabled-color loading-text" show.bind="is_pending">
            Loading Tags...
        </div>
        <!-- temporary flat dump, replaced by the nested tree in a follow-up -->
        <div show.bind="!is_pending && tags_info !== null">
            <div class="regions-header">Tagsets</div>
            <template repeat.for="tagset of tagsets_list">
                <div>${tagset.text} (#${tagset.id})</div>
            </template>
            <div class="regions-header">Tags</div>
            <template repeat.for="tag of tags_list">
                <div>${tag.text} (#${tag.id}) tagset: ${tag.tagset_id}</div>
            </template>
            <div class="regions-header">Roi Tags</div>
            <template repeat.for="entry of tags_info.roi_tags">
                <div>roi ${entry[0]} - tag ${entry[1]}</div>
            </template>
            <div class="regions-header">Shape Tags</div>
            <template repeat.for="entry of tags_info.shape_tags">
                <div>roi ${entry[0]} - shape ${entry[1]} - tag ${entry[2]}</div>
            </template>
        </div>
    </div>
</template>
