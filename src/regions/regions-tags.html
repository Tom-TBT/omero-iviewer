<template>
    <div class="regions-tags">
        <div class="disabled-color loading-text"
            show.bind="is_pending || (regions_info !== null && !regions_info.ready)">
            Loading Tags...
        </div>
        <div class="disabled-color loading-text"
            show.bind="!is_pending && regions_info !== null && regions_info.ready &&
                       tree !== null && rows.length === 0">
            No tags on this image
        </div>

        <div class="regions-table tags-table"
            show.bind="!is_pending && tree !== null && rows.length > 0">
            <div class="regions-header tags-header">
                <div class="columns-dropdown dropdown">
                    <button type="button"
                        class="btn btn-default btn-sm dropdown-toggle
                                glyphicon glyphicon-option-vertical"
                        style="padding: 0px; top: -2px; right: 0;"
                        data-toggle="dropdown">
                    </button>
                    <ul class="dropdown-menu">
                        <li click.delegate="showColumn('comments')">
                            <span class="show_comments">
                                ${active_column === 'comments' ? '&#10003;' : '&nbsp;'}
                            </span>
                            <a href="#">Show Comments</a>
                        </li>
                        <li click.delegate="showColumn('measurements')">
                            <span class="show_measurements">
                                ${active_column === 'measurements' ? '&#10003;' : '&nbsp;'}
                            </span>
                            <a href="#">Show Area/Length</a>
                        </li>
                    </ul>
                </div>
                <div class="regions-table-col tags-show">
                    <label for="tags_shapes_visibility_toggler"
                            show.bind="regions_info.number_of_shapes > 0">Show</label>
                    <input id="tags_shapes_visibility_toggler"
                            title="Show/Hide all"
                            checked.one-way="regions_info.visibility_toggles === 0"
                            show.bind="regions_info.number_of_shapes > 0"
                            change.delegate="toggleAllShapesVisibility($event)"
                            type="checkbox" />
                </div>
                <div class="regions-table-col shape-z ${sortCss(sortBy, sortAscending, 'theZ')}"
                    click.delegate="sort('theZ')">Z</div>
                <div class="regions-table-col shape-t ${sortCss(sortBy, sortAscending, 'theT')}"
                    click.delegate="sort('theT')">T</div>
                <div class="regions-table-col shape-c ${sortCss(sortBy, sortAscending, 'theC')}"
                    click.delegate="sort('theC')">C</div>
                <div class="regions-table-col tags-label ${sortCss(sortBy, sortAscending, 'shapeText')}"
                        click.delegate="sort('shapeText')"
                        show.bind="active_column === 'comments'">Comment
                    </div>
                <div class="regions-table-col shape-area ${sortCss(sortBy, sortAscending, 'area')}"
                        click.delegate="sort('area')"
                        show.bind="active_column === 'measurements'">
                        Area (${regions_info.image_info.image_pixels_size.symbol_x ||
                                'px'}&#178;)
                    </div>
                <div class="regions-table-col shape-length ${sortCss(sortBy, sortAscending, 'length')}"
                        click.delegate="sort('length')"
                        show.bind="active_column === 'measurements'">
                        Length (${regions_info.image_info.image_pixels_size.symbol_x ||
                                'px'})
                    </div>
            </div>
            <template repeat.for="row of rows">
                <div class="regions-table-row tags-table-row"
                    id="${'tag-tree-row-' + row.key}"
                    css="${row.type === 'shape' && !row.node.missing && row.node.shape.selected ?
                            'background-color: #d0d0ff;' : ''}"
                    click.delegate="selectRow(row, $event)">
                    <!-- Tagset/Tag rows are category blocks, not data rows:
                         one fused, left-justified cell (arrow, icon,
                         checkbox, name all touching), no Z/T/C/etc -->
                    <div class="regions-table-col tags-category"
                        if.bind="row.type === 'tagset' || row.type === 'tag'">
                        <span class="tree-toggle"
                            css="padding-left: ${row.depth * 16}px;"
                            click.delegate="toggleNode(row.node, $event)">
                            ${row.node.show ? '&#9660;' : '&#9658;'}
                        </span>
                        <img src.bind="getIconUrl('tags')" if.bind="row.type === 'tagset'" />
                        <img src.bind="getIconUrl('tag')" if.bind="row.type === 'tag'" />
                        <input type="checkbox"
                            title="Show/Hide"
                            checked.one-way="isRowVisible(row)"
                            change.delegate="toggleVisibility(row, $event)"/>
                        <span class="tags-category-text">${row.node.text}</span>
                    </div>
                    <template if.bind="row.type === 'roi' || row.type === 'shape'">
                        <div class="regions-table-col tags-show">
                            <span class="tags-show-left">
                                <span class="tree-toggle"
                                    if.bind="row.type !== 'shape'"
                                    css="padding-left: ${row.depth * 16}px;"
                                    click.delegate="toggleNode(row.node, $event)">
                                    ${row.node.show ? '&#9660;' : '&#9658;'}
                                </span>
                            </span>
                            <input type="checkbox"
                                if.bind="!row.node.missing"
                                title="Show/Hide"
                                checked.one-way="isRowVisible(row)"
                                change.delegate="toggleVisibility(row, $event)"/>
                        </div>
                        <div class="regions-table-col shape-z">
                            ${row.type === 'shape' && !row.node.missing && row.node.shape.TheZ !== -1 ?
                                (row.node.shape.TheZ + 1) : ""}
                        </div>
                        <div class="regions-table-col shape-t">
                            ${row.type === 'shape' && !row.node.missing && row.node.shape.TheT !== -1 ?
                                (row.node.shape.TheT + 1) : ""}
                        </div>
                        <div class="regions-table-col shape-c">
                            ${row.type === 'shape' && !row.node.missing && row.node.shape.TheC !== -1 ?
                                (row.node.shape.TheC + 1) : ""}
                        </div>
                        <div class="regions-table-col tags-label">
                            <template if.bind="row.type === 'roi'">
                                ${row.node.missing ?
                                    ('ROI ' + row.node.roi_id) :
                                    (row.node.roi.name || ('ROI ' + row.node.roi_id))}
                            </template>
                            <template if.bind="row.type === 'shape' && active_column === 'comments'">
                                ${row.node.missing ?
                                    ('Shape ' + row.node.shape_id) :
                                    (row.node.shape.Text || ('Shape ' + row.node.shape_id))}
                            </template>
                        </div>
                        <div class="regions-table-col shape-area"
                            show.bind="active_column === 'measurements'">
                            ${row.type === 'shape' && !row.node.missing && row.node.shape.Area !== -1 ?
                                row.node.shape.Area : ""}
                        </div>
                        <div class="regions-table-col shape-length"
                            show.bind="active_column === 'measurements'">
                            ${row.type === 'shape' && !row.node.missing && row.node.shape.Length !== -1 ?
                                row.node.shape.Length : ""}
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
